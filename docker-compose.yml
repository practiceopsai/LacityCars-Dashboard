# Local development infrastructure only. Railway supplies managed Postgres/Redis in production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lacity
      POSTGRES_PASSWORD: lacity_local_dev
      POSTGRES_DB: lacity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacity -d lacity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
